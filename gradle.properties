org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP still registers generated Kotlin through the legacy source-set API. This
# compatibility switch can be removed once the pinned KSP version adopts AGP's
# built-in Kotlin source API.
android.disallowKotlinSourceSets=false
